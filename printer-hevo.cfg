# maximum_pulse_width = 0.002

[heater_bed]
heater_pin: P2.5
sensor_type: ATC Semitec 104GT-2
sensor_pin: P0.24
min_temp: -20
max_temp: 130

[fan] # model fan
# pin: P2.4
pin: EBBCan: PA1

[heater_fan extruder_fan]
# pin: P1.4
pin: EBBCan: PA0
fan_speed: 0.85

[controller_fan board_fan]
pin: P2.6
#cycle_time: 0.005
hardware_pwm: False
max_power: 0.8
shutdown_speed: 0
kick_start_time: 0.100
idle_timeout: 90
idle_speed: 0.6
heater: extruder

# [display]
# lcd_type: ssd1306
# i2c_mcu: host
# i2c_bus: i2c.0
# menu_timeout: 30

[idle_timeout]
timeout: 3600

