[include fluidd.cfg]
[include mainsail.cfg]
[include gab-3d-utilities.cfg]
[include shell_command.cfg]
[include printer/speed.cfg]
[include printer/homing.cfg]
[include KAMP_Settings.cfg]
[include printer/macros.cfg]
[include printer/micro_probe.cfg]
[include printer/adxl.cfg]

[virtual_sdcard]
path: /home/oprint/printer_data/gcodes/
[pause_resume]
recover_velocity: 100
[force_move]
enable_force_move: True
[exclude_object]
[gcode_arcs]
[respond]

[mcu]
serial: /dev/ttyS0
baud: 250000
restart_method: command

[mcu host]
serial: /tmp/klipper_host_mcu

[mcu EBBCan]
canbus_uuid: 90e9dca20ffa

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 10000
max_z_velocity: 25
max_z_accel: 300
square_corner_velocity: 12

[stepper_x]
step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
rotation_distance: 40
microsteps: 128
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -17
position_min: -17
position_max: 262
homing_speed: 48
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: P1.1
run_current: 1.50
stealthchop_threshold: 0
interpolate: False
diag_pin: ^P1.29
driver_SGTHRS: 110

[stepper_y]
step_pin: P2.2
dir_pin: P2.3
enable_pin: !P2.1
rotation_distance: 40
microsteps: 128
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -5
position_min: -5
position_max: 270
homing_speed: 48
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: P1.8
diag_pin: ^P1.27
run_current: 1.50
stealthchop_threshold: 0
interpolate: False
driver_SGTHRS: 112

[stepper_z]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
rotation_distance: 2
microsteps: 64
position_max: 220
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z]
uart_pin: P1.15
run_current: 0.9
# stealthchop_threshold: 20
interpolate: False

[stepper_z1]
step_pin: P1.9
dir_pin: !P1.14
enable_pin: !P0.10
rotation_distance: 2
microsteps: 64
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z1]
uart_pin: P1.17
run_current: 0.9
# stealthchop_threshold: 20
interpolate: False

[stepper_z2]
step_pin: P0.22
dir_pin: !P2.11
enable_pin: !P0.21
rotation_distance: 2
microsteps: 64
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z2]
uart_pin: P1.10
run_current: 0.9
# stealthchop_threshold: 20
interpolate: False

[extruder]
step_pin: EBBCan: PD0
dir_pin: !EBBCan: PD1
enable_pin: !EBBCan: PD2
rotation_distance: 4.695
full_steps_per_rotation: 200
microsteps: 64
nozzle_diameter: 0.400
filament_diameter: 1.750
# heater_pin: P2.7
# sensor_pin: P0.23
heater_pin: EBBCan: PB13
sensor_pin: EBBCan: PA3
sensor_type: ATC Semitec 104NT-4-R025H42G
min_temp: 10
max_temp: 320
min_extrude_temp: 10
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 500
max_extrude_only_velocity: 200
max_extrude_only_accel: 10000
pressure_advance: 0.033
pressure_advance_smooth_time: 0.03
max_power: 0.8
smooth_time: 2

[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.650
stealthchop_threshold: 0
interpolate: False

[firmware_retraction]
retract_length: 0.6
retract_speed: 30
unretract_extra_length: 0
unretract_speed: 30

# [probe]
# pin: ^P1.25
# speed: 5.0
# x_offset: -28
# y_offset: 3
# z_offset: 0.99
# activate_gcode:
